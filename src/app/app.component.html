<div style="padding: 1rem;">
  <h2>ChatGPT POC</h2>
  <form (ngSubmit)="sendMessage()">
    <input [(ngModel)]="userInput" name="userInput" placeholder="Say something..." required />
    <button type="submit">Send</button>
  </form>
  <p><strong>Response:</strong> {{ response }}</p>
</div>

<router-outlet />
